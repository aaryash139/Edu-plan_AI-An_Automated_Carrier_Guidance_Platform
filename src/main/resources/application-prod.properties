# Production Profile
# Uses Environment Variables provided by the Cloud Hosting Provider (Render, Railway, Heroku, AWS, etc)

# The hosting provider will usually set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edupath_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Spring will automatically detect the driver (MySQL or PostgreSQL) based on the URL.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Keep logs clean in production
logging.level.org.springframework.web=ERROR
logging.level.com.edupath=INFO
