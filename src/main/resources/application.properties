# Default: H2 in-memory (IntelliJ se turant run ho jaye)
# MySQL use karne ke liye: spring.profiles.active=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=8080
server.servlet.session.timeout=30m

# JSP views -> src/main/webapp/WEB-INF/jsp/
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.edupath=DEBUG

# Python recommendation engine (src/main/resources/python/recommend.py)
edupath.python.enabled=true
edupath.python.command=python
edupath.python.timeout-seconds=10

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.apache.jasper=DEBUG
logging.level.org.springframework.web=DEBUG

edupath.admin.code=EDUPATH_ADMIN_2025